name: Godot CI

on:
  push:
    branches: ["main", "rehearsal/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap pinned Godot
        run: ./scripts/bootstrap_godot.sh

      - name: Validate project
        run: ./scripts/validate_project.sh

      - name: Run headless tests
        run: ./scripts/run_tests.sh

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Capture graphical acceptance matrix
        run: |
          mkdir -p artifacts/visual
          xvfb-run -a ./.tools/godot --audio-driver Dummy --path . --script tests/capture_visual_matrix.gd
          test "$(find artifacts/visual -name '*.png' | wc -l)" -ge 10

      - name: Upload visual acceptance matrix
        uses: actions/upload-artifact@v4
        with:
          name: neon-cube-visual-matrix
          path: artifacts/visual/*.png

      - name: Bootstrap export templates
        run: ./scripts/bootstrap_export_templates.sh

      - name: Build Linux release
        run: ./scripts/build_release.sh

      - name: Smoke-test exported game
        run: ./dist/neon-cube.x86_64 --headless --quit-after 5

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: neon-cube-linux-x86_64
          path: dist/neon-cube.x86_64
