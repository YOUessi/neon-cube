name: Godot CI

on:
  push:
    branches: ["main", "production/**", "level/**", "gameplay/**", "art/**", "perf/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap pinned Godot
        run: ./scripts/bootstrap_godot.sh

      - name: Validate project
        run: ./scripts/validate_project.sh

      - name: Run headless tests
        run: ./scripts/run_tests.sh

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Capture rendered gameplay frame
        run: |
          mkdir -p artifacts
          xvfb-run -a ./.tools/godot --path . --script tests/capture_screenshot.gd
          test -s artifacts/neon_cube_ci.png

      - name: Upload visual smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-cube-visual-smoke
          path: artifacts/neon_cube_ci.png

      - name: Bootstrap export templates
        run: ./scripts/bootstrap_export_templates.sh

      - name: Build Linux release
        run: ./scripts/build_release.sh

      - name: Smoke-test exported game
        run: ./dist/neon-cube.x86_64 --headless --quit-after 5

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: neon-cube-linux-x86_64
          path: dist/neon-cube.x86_64
